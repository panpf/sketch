name: Release Version

on:
  push:
    tags:
      - '*'

env:
  JAVA_VERSION: 21
  JAVA_DISTRIBUTION: zulu

jobs:
  check-abi:
    name: Check ABI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true

      - name: Run ABI check
        run: |
          ./gradlew checkKotlinAbi || {
            exit_code=$?
            printf '%s\n' \
              "*** Sketch's public API has changed." \
              "If this change is intentional, run './gradlew updateKotlinAbi' and commit the new API files. ***"
            exit $exit_code
          }

  test-android-23:
    name: Test Android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 23 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true

      # API 30+ emulators only have x86_64 system images.
      - name: Get AVD info
        uses: ./.github/actions/get-avd-info
        id: avd-info
        with:
          api-level: ${{ matrix.api-level }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ steps.avd-info.outputs.arch }}
          target: ${{ steps.avd-info.outputs.target }}
          profile: pixel # from command 'avdmanager list device'
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          script: |
            mv .github/debug.keystore ~/.android
            internal/test_android_23.sh

  test-android-24p:
    name: Test Android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 26, 30, 34 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true

      # API 30+ emulators only have x86_64 system images.
      - name: Get AVD info
        uses: ./.github/actions/get-avd-info
        id: avd-info
        with:
          api-level: ${{ matrix.api-level }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ steps.avd-info.outputs.arch }}
          target: ${{ steps.avd-info.outputs.target }}
          profile: pixel # from command 'avdmanager list device'
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          script: |
            mv .github/debug.keystore ~/.android
            internal/test_android.sh

  test-ios:
    name: Test iOS
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true

      - name: Run ios test
        run: internal/test_ios.sh

  test-jvm-linux:
    name: Test JVM Linux
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true

      - name: Run jvm test
        run: internal/test_jvm.sh

  test-jvm-macos:
    name: Test JVM macOS
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true

      - name: Run jvm test
        run: internal/test_jvm.sh

  test-jvm-windows:
    name: Test JVM Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true

      - name: Run jvm test
        run: ./gradlew desktopTest --continue

  test-macos-native:
    name: Test macOS Native
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true

      - name: Run macOS tests
        run: internal/test_macos_native.sh

  package-android:
    name: Package Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Run package
        run: internal/package_android.sh

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-artifacts
          path: samples/androidApp/build/outputs/apk/release/*.apk

  package-ios:
    name: Package iOS
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true

      - name: Run package
        run: internal/package_ios.sh

      - name: Read version name
        id: version_name_step
        run: |
          versionName=$(grep '^versionName=' gradle.properties | awk -F'=' '{print $2}')
          echo "version_name=$versionName" >> $GITHUB_OUTPUT

      - name: Zip
        run: |
          cd samples/shared/build/ios/outputs/Build/Products/Debug-iphonesimulator
          zip -r "sketch-sample-ios-${{ steps.version_name_step.outputs.version_name }}.app.zip" "Sketch4.app"
          cd -

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ios-artifacts
          path: samples/shared/build/ios/outputs/Build/Products/Debug-iphonesimulator/*.app.zip

  package-jvm-linux:
    name: Package JVM Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true

      - name: Run package
        run: internal/package_jvm.sh

      - name: Upload JVM Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jvm-linux-artifacts
          path: samples/desktopApp/build/compose/binaries/main-release/deb/*.deb

  package-jvm-macos:
    name: Package JVM macOS
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true

      - name: Run package
        run: internal/package_jvm.sh

      - name: Upload JVM macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jvm-macos-artifacts
          path: samples/desktopApp/build/compose/binaries/main-release/dmg/*.dmg

  package-jvm-windows:
    name: Package JVM Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true

      - name: Run package
        run: ./gradlew samples:desktopApp:packageReleaseDistributionForCurrentOS

      - name: Upload JVM Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jvm-windows-artifacts
          path: samples/desktopApp/build/compose/binaries/main-release/msi/*.msi

  package-macos-native:
    name: Package macOS Native
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true

      - name: Run package
        run: internal/package_macos_native.sh

      - name: Upload macOS native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-native-artifacts
          path: samples/macosApp/build/compose/binaries/main/native-macosArm64-release-dmg/*.dmg

  package-js-browser:
    name: Package js Browser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true

      - name: Run package
        run: internal/package_js.sh

      - name: Read version name
        id: version_name_step
        run: |
          versionName=$(grep '^versionName=' gradle.properties | awk -F'=' '{print $2}')
          echo "version_name=$versionName" >> $GITHUB_OUTPUT

      - name: Zip
        run: |
          cd samples/jsApp/build/dist/js/productionExecutable
          zip -r "sketch-sample-js-browser-${{ steps.version_name_step.outputs.version_name }}.zip" *
          cd -

      - name: Upload js browser artifacts
        uses: actions/upload-artifact@v7
        with:
          name: js-browser-artifacts
          path: samples/jsApp/build/dist/js/productionExecutable/*.zip

  package-wasmJs-browser:
    name: Package wasmJs Browser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true

      - name: Run package
        run: internal/package_wasmJs.sh

      - name: Read version name
        id: version_name_step
        run: |
          versionName=$(grep '^versionName=' gradle.properties | awk -F'=' '{print $2}')
          echo "version_name=$versionName" >> $GITHUB_OUTPUT

      - name: Zip
        run: |
          cd samples/wasmJsApp/build/dist/wasmJs/productionExecutable
          zip -r "sketch-sample-wasmJs-browser-${{ steps.version_name_step.outputs.version_name }}.zip" *
          cd -

      - name: Upload wasmJs browser artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasmJs-browser-artifacts
          path: samples/wasmJsApp/build/dist/wasmJs/productionExecutable/*.zip

  deploy-api-docs:
    name: Deploy API Docs
    needs:
      - check-abi
      - test-android-23
      - test-android-24p
      - test-ios
      - test-jvm-linux
      - test-jvm-macos
      - test-jvm-windows
      - test-macos-native
      - package-android
      - package-ios
      - package-jvm-linux
      - package-jvm-macos
      - package-jvm-windows
      - package-macos-native
      - package-js-browser
      - package-wasmJs-browser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true

      - name: Build the API docs
        run: ./gradlew dokkaGenerate

      - name: Check out the gh-pages branch
        run: |
          git fetch origin gh-pages:gh-pages
          git checkout gh-pages

      - name: Remove old api directory
        run: rm -rf api/*

      - name: Create api directory
        run: mkdir -p api

      - name: Move build artifacts to api directory
        run: mv build/dokka/html/* api/

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: "Update api docs"
          branch: gh-pages
          file_pattern: api/*

  publish:
    name: Publish To Maven Central
    needs: deploy-api-docs
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Run publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_NEXUS_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

  release:
    name: Release New Version
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download android artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-artifacts
          path: ./downloaded

      - name: Download ios artifacts
        uses: actions/download-artifact@v8
        with:
          name: ios-artifacts
          path: ./downloaded

      - name: Download jvm linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: jvm-linux-artifacts
          path: ./downloaded

      - name: Download jvm macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: jvm-macos-artifacts
          path: ./downloaded

      - name: Download jvm windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: jvm-windows-artifacts
          path: ./downloaded

      - name: Download macOS native artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-native-artifacts
          path: ./downloaded

      - name: Download js-browser artifacts
        uses: actions/download-artifact@v8
        with:
          name: js-browser-artifacts
          path: ./downloaded

      - name: Download wasmJs-browser artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasmJs-browser-artifacts
          path: ./downloaded

      - name: Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: startsWith(github.ref, 'refs/tags/') # Only run on tag push
        with:
          body: |
            Please check the [CHANGELOG.md](https://github.com/panpf/sketch/blob/main/CHANGELOG.md) file for updated log.
            
            Android, iOS, jvm, macos native and web packages, see the Assets attachment.
            
            Web example：https://panpf.github.io/sketch/app.
          files: ./downloaded/*
          make_latest: true