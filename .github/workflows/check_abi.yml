name: Check ABI

on: workflow_dispatch

env:
  JAVA_VERSION: 21
  JAVA_DISTRIBUTION: zulu

jobs:
  check-abi:
    name: Check ABI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true

      - name: Run ABI check
        run: |
          ./gradlew checkKotlinAbi || {
            exit_code=$?
            printf '%s\n' \
              "*** Sketch's public API has changed." \
              "If this change is intentional, run './gradlew updateKotlinAbi' and commit the new API files. ***"
            exit $exit_code
          }